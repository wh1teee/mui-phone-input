name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-24:
    name: Node 24 blocking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - id: published-runtime-artifact
        run: |
          artifact_dir="$RUNNER_TEMP/mui-phone-input-runtime"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          pnpm build
          pnpm --dir packages/mui-phone-input pack --pack-destination "$artifact_dir"
          artifact_path="$(find "$artifact_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$artifact_path"
          echo "tarball=$artifact_path" >> "$GITHUB_OUTPUT"
      - run: pnpm ci:pr
        env:
          PACKAGE_ARTIFACT: ${{ steps.published-runtime-artifact.outputs.tarball }}
          WCAG_BROWSER: chromium
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - run: >-
          node scripts/verify-published-runtime.mjs
          --expected-major=22
          --artifact="${{ steps.published-runtime-artifact.outputs.tarball }}"

  node-26-forward:
    name: Node 26 forward signal
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:forward

