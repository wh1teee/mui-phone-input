name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-24:
    name: Node 24 blocking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - id: published-runtime-artifact
        run: |
          artifact_dir="$RUNNER_TEMP/mui-phone-input-runtime"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          pnpm build
          pnpm --dir packages/mui-phone-input pack --pack-destination "$artifact_dir"
          artifact_path="$(find "$artifact_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$artifact_path"
          echo "tarball=$artifact_path" >> "$GITHUB_OUTPUT"
      - run: pnpm ci:pr
        env:
          PACKAGE_ARTIFACT: ${{ steps.published-runtime-artifact.outputs.tarball }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
      - run: >-
          node scripts/verify-published-runtime.mjs
          --expected-major=22
          --artifact="${{ steps.published-runtime-artifact.outputs.tarball }}"

  node-26-forward:
    name: Node 26 forward signal
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:forward

