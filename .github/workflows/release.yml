name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.27.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - id: candidate
        run: |
          candidate_dir="$RUNNER_TEMP/mui-phone-input-release"
          node scripts/create-release-candidate.mjs --output-dir="$candidate_dir"
          version="$(node -p "require('./packages/mui-phone-input/package.json').version")"
          tarball="$candidate_dir/wh1teee-mui-phone-input-$version.tgz"
          test -f "$tarball"
          echo "directory=$candidate_dir" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm ci:pr
        env:
          PACKAGE_ARTIFACT: ${{ steps.candidate.outputs.tarball }}
      - run: pnpm verify:wcag22-visual
        env:
          WCAG_BROWSER: chromium
      - run: pnpm test:browser
        env:
          VITEST_BROWSER: firefox
      - run: pnpm verify:wcag22-visual
        env:
          WCAG_BROWSER: firefox
      - run: pnpm test:browser
        env:
          VITEST_BROWSER: webkit
      - run: pnpm verify:wcag22-visual
        env:
          WCAG_BROWSER: webkit
      - run: >-
          node scripts/verify-release-candidate.mjs
          --directory="${{ steps.candidate.outputs.directory }}"
          --require-tag
      - run: >-
          node scripts/verify-package.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-tracer-package.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-published-runtime.mjs
          --expected-major=24
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-packed-consumers.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          SUPPORT_MATRIX=minimum node scripts/verify-packed-consumers.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
      - run: >-
          node scripts/verify-published-runtime.mjs
          --expected-major=22
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          directory="${{ steps.candidate.outputs.directory }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$directory"/* --clobber
          else
            release_flags=(--draft)
            if [[ "${{ steps.candidate.outputs.prerelease }}" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" "$directory"/* \
              "${release_flags[@]}" \
              --target "$GITHUB_SHA" \
              --title "@wh1teee/mui-phone-input ${{ steps.candidate.outputs.version }}" \
              --notes-file "$directory/RELEASE_NOTES.md"
          fi
      - name: Publish exact tarball through npm OIDC
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          specifier="@wh1teee/mui-phone-input@${{ steps.candidate.outputs.version }}"
          if npm view "$specifier" version >/dev/null 2>&1; then
            echo "$specifier is already present; registry parity verification remains mandatory."
          else
            npm publish "${{ steps.candidate.outputs.tarball }}" \
              --access public \
              --tag "${{ steps.candidate.outputs.dist_tag }}" \
              --provenance
          fi
      - run: >-
          node scripts/verify-registry-release.mjs
          --directory="${{ steps.candidate.outputs.directory }}"
      - name: Publish registry evidence and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          directory="${{ steps.candidate.outputs.directory }}"
          gh release upload "$tag" \
            "$directory/registry.json" \
            "$directory/registry-tarball-sha256.txt" \
            "$directory/provenance-audit.json" \
            --clobber
          if [[ "${{ steps.candidate.outputs.prerelease }}" == "true" ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
