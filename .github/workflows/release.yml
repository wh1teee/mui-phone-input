name: Release early next canary

on:
  push:
    tags:
      - v0.1.0-next.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - id: candidate
        run: |
          candidate_dir="$RUNNER_TEMP/mui-phone-input-release"
          node scripts/create-release-candidate.mjs --output-dir="$candidate_dir"
          version="$(node -p "require('./packages/mui-phone-input/package.json').version")"
          tarball="$candidate_dir/wh1teee-mui-phone-input-$version.tgz"
          test -f "$tarball"
          echo "directory=$candidate_dir" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm ci:pr
        env:
          PACKAGE_ARTIFACT: ${{ steps.candidate.outputs.tarball }}
      - run: >-
          node scripts/verify-release-candidate.mjs
          --directory="${{ steps.candidate.outputs.directory }}"
          --require-tag
      - run: >-
          node scripts/verify-package.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-tracer-package.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-published-runtime.mjs
          --expected-major=24
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-packed-consumers.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          SUPPORT_MATRIX=minimum node scripts/verify-packed-consumers.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
      - run: >-
          node scripts/verify-published-runtime.mjs
          --expected-major=22
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - name: Create or refresh draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          directory="${{ steps.candidate.outputs.directory }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$directory"/* --clobber
          else
            gh release create "$tag" "$directory"/* \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "@wh1teee/mui-phone-input ${{ steps.candidate.outputs.version }}" \
              --notes-file "$directory/RELEASE_NOTES.md"
          fi
      - name: Publish exact tarball through npm OIDC
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: >-
          npm publish "${{ steps.candidate.outputs.tarball }}"
          --access public
          --tag next
          --provenance
      - run: >-
          node scripts/verify-registry-release.mjs
          --directory="${{ steps.candidate.outputs.directory }}"
      - name: Publish registry evidence and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          directory="${{ steps.candidate.outputs.directory }}"
          gh release upload "$tag" \
            "$directory/registry.json" \
            "$directory/registry-tarball-sha256.txt" \
            "$directory/provenance-audit.json" \
            --clobber
          gh release edit "$tag" --draft=false --prerelease
