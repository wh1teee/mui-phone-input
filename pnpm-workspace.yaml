packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
autoInstallPeers: false
engineStrict: true
linkWorkspacePackages: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
overrides:
  "nanoid@<3.3.18": 3.3.18
packageExtensions:
  # Published Floating UI declarations import React but omit the type dependency.
  # An explicit edge preserves strict types in the shared global virtual store.
  "@floating-ui/react-dom@2.1.9":
    dependencies:
      "@types/react": 19.3.0
  "next@>=16.3.5 <17":
    dependencies:
      "@types/react": ^19.3.0
      "@types/react-dom": ^19.3.0
  "react-hook-form@>=7.83.0 <8":
    dependencies:
      "@types/react": ^19.3.0
  "@mui/material@>=9.4.0 <10":
    dependencies:
      "@mui/styled-engine": ^9.4.0
  "@mui/styled-engine@>=9.4.0 <10":
    dependencies:
      "@types/react": ^19.3.0
  "@emotion/utils@>=1.4.2 <2":
    dependencies:
      "@emotion/sheet": ^1.4.0
preferWorkspacePackages: false
resolutionMode: highest
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
verifyStoreIntegrity: true
